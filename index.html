<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Purtidy · 登录</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f4f3ed;color:#26453f;font:16px/1.65 system-ui,sans-serif;padding:24px}main{width:min(100%,420px)}.brand{font-size:13px;letter-spacing:.22em}h1{font-size:40px;line-height:1.2;margin:18px 0}p{color:#64746c}form{margin-top:32px;background:#fff;padding:28px;border:1px solid #dce3db;border-radius:12px}label{display:block;margin-bottom:20px;font-size:14px}input{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bccac1;border-radius:6px;margin-top:6px}button{width:100%;padding:13px;background:#294f45;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.6}:focus-visible{outline:3px solid #bb8334;outline-offset:3px}#status{color:#9b392c;min-height:1.7em;margin-bottom:0;font-size:14px}footer{margin-top:24px;color:#758277;font-size:12px}</style></head><body><main><div class="brand">PURTIDY / WORKSPACE</div><h1>一起，选好每一件。</h1><p>商品图集、货源与审核记录，集中在这里。</p><form id="login"><label>账号<input name="username" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>进入工作台</button><p id="status" role="status" aria-live="polite"></p></form><footer>登录后可查看商品总览、下载素材和试算成本。</footer><noscript>请启用 JavaScript 后登录。</noscript></main><script>
const credentialDigest = 'ede44fb2593b8d0a54af71a2325955ea39cbc14dfce05d0d1611e741d0a093e7';
const form = document.querySelector('form'), status = document.querySelector('#status');
const root = new URL('.',location.href), home = new URL('outputs/产品评审册/index.html',root);
function destination(){try{const next=new URL(new URL(location.href).searchParams.get('next')||home.href);if(next.origin===root.origin&&next.pathname.startsWith(root.pathname)&&next.pathname!==root.pathname+'index.html'&&next.pathname!==root.pathname)return next.href;}catch{}return home.href;}
try{if(Number(sessionStorage.getItem('purtidy-session-v1'))>Date.now())location.replace(destination());}catch{}
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='';try{const values=new FormData(form);const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(values.get('username')+':'+values.get('password')));const digest=[...new Uint8Array(bytes)].map(n=>n.toString(16).padStart(2,'0')).join('');if(digest!==credentialDigest){status.textContent='账号或密码不正确。';return;}sessionStorage.setItem('purtidy-session-v1',String(Date.now()+12*60*60*1000));location.replace(destination());}catch{status.textContent='登录未完成，请使用 HTTPS，并允许浏览器存储。';}finally{button.disabled=false;}};
</script></body></html>
